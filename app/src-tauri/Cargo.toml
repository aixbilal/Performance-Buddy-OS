[package]
name = "app"
version = "1.0.0-rc.1"
description = "Performance Buddy OS"
authors = ["aixbilal"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
# Durable local persistence (Batch 0). `bundled` compiles SQLite in-tree so
# there is no system libsqlite dependency on any platform.
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
# WebdriverIO renderer E2E — provides `browser.tauri.execute()` for driving the
# real frontend. Compiled in all profiles so its capability ACL resolves; only
# registered at runtime under `#[cfg(debug_assertions)]` (see lib.rs).
tauri-plugin-wdio = "1"
